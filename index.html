<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Quiz</title>
<style>
:root{--bg:#f6f7f2;--card:#fff;--tx:#1f2a1f;--mut:#667066;--bd:#d9ddd2;--ac:#2f7d46;--ok:#2f7d46;--okbg:#dff2e3;--miss:#b7791f;--missbg:#fdf0d5;--bad:#c0392b;--badbg:#fbe0dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a15;--card:#1d251e;--tx:#e8eee8;--mut:#9aa89b;--bd:#334034;--ac:#5fbf7c;--ok:#7bd495;--okbg:#1d3a27;--miss:#e8b24f;--missbg:#3b2f14;--bad:#ef7b6d;--badbg:#431d19}}
:root[data-theme="dark"]{--bg:#141a15;--card:#1d251e;--tx:#e8eee8;--mut:#9aa89b;--bd:#334034;--ac:#5fbf7c;--ok:#7bd495;--okbg:#1d3a27;--miss:#e8b24f;--missbg:#3b2f14;--bad:#ef7b6d;--badbg:#431d19}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
h1{font-size:1.2rem;margin:0}
.stats{font-size:.85rem;color:var(--mut);text-align:right}.stats b{color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.q{font-size:1.35rem;font-weight:800;margin:0 0 4px;line-height:1.3}.hint{color:var(--mut);font-size:.9rem;margin-bottom:6px}
.cat{margin-top:14px}.cat h3{margin:0 0 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;padding:9px 14px;font-size:.95rem;cursor:pointer}
.chip.sel{border-color:var(--ac);background:var(--okbg);font-weight:600}
.chip.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
.chip.miss{border-color:var(--miss);background:var(--missbg);color:var(--miss);font-weight:600;border-style:dashed}
.chip.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad);text-decoration:line-through}
.chip:disabled{cursor:default}
.res{margin-top:16px;padding-top:12px;border-top:1px solid var(--bd);font-size:.93rem;line-height:1.5}
.res div{margin-top:4px}
.btn{margin-top:16px;width:100%;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:13px;font-size:1rem;font-weight:600;cursor:pointer}
.small{background:none;border:0;color:var(--mut);font-size:.8rem;text-decoration:underline;cursor:pointer;padding:0;margin-top:2px}
.legend{font-size:.78rem;color:var(--mut);margin-top:10px}
</style></head><body><div class="wrap">
<div class="top"><h1>🥗 Menu Quiz</h1>
<div class="stats"><div>Correct <b id="sp">0</b> / <b id="st">0</b> · Streak <b id="ss">0</b></div><button class="small" id="rst">Reset score</button></div></div>
<div id="app"></div>
</div>
<script src="menu-data.js"></script>
<script src="questions.js"></script>
<script>
const $=id=>document.getElementById(id);
if(typeof MENU_DATA==="undefined"||typeof QUESTIONS==="undefined"){$("app").innerHTML='<div class="card">Could not load <b>menu-data.js</b> or <b>questions.js</b>. Keep all three files in the same folder.</div>';throw new Error("data files missing")}
const MENU=MENU_DATA,CATS=Object.keys(MENU);
const esc=s=>String(s).replace(/"/g,"&quot;");
const pick=a=>a[Math.random()*a.length|0];
const problems=[];
QUESTIONS.forEach(q=>CATS.forEach(c=>(q[c]||[]).forEach(x=>{if(!MENU[c].includes(x))problems.push(q.name+" -> "+c+": \""+x+"\"")})));
let st={p:0,t:0,s:0},last=-1;try{st=JSON.parse(localStorage.getItem("mq4")||"")||st}catch(e){}
function save(){try{localStorage.setItem("mq4",JSON.stringify(st))}catch(e){}$("sp").textContent=st.p;$("st").textContent=st.t;$("ss").textContent=st.s}
function next(){
 let n;do{n=Math.random()*QUESTIONS.length|0}while(QUESTIONS.length>1&&n===last);last=n;
 const m=QUESTIONS[n],sel={};let done=false;
 let h='';
 if(problems.length)h+='<div class="card" style="margin-bottom:12px;border-color:var(--bad)"><b>Check questions.js – these don\'t match menu-data.js:</b><br>'+problems.join("<br>")+'</div>';
 h+='<div class="card"><div class="q">What\'s on the <u>'+m.name+'</u>?</div><div class="hint">Tap everything that\'s in it. Some sections may be empty.</div>';
 CATS.forEach(c=>{sel[c]=new Set();h+='<div class="cat" data-k="'+c+'"><h3>'+c+'</h3><div class="chips">'+MENU[c].map(x=>'<button class="chip" data-v="'+esc(x)+'">'+x+'</button>').join("")+'</div></div>'});
 h+='<div id="rs"></div><button class="btn" id="go">Check</button></div>';
 $("app").innerHTML=h;
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{if(done)return;const c=b.closest(".cat").dataset.k,v=b.dataset.v;sel[c].has(v)?sel[c].delete(v):sel[c].add(v);b.classList.toggle("sel")});
 $("go").onclick=()=>{
  done=true;let ok=true,out="";
  CATS.forEach(c=>{
   const right=m[c]||[],s=sel[c],miss=right.filter(x=>!s.has(x)),bad=[...s].filter(x=>!right.includes(x));
   if(miss.length||bad.length)ok=false;
   document.querySelectorAll('.cat[data-k="'+c+'"] .chip').forEach(b=>{const inn=right.includes(b.dataset.v),on=s.has(b.dataset.v);b.disabled=true;b.className="chip "+(inn&&on?"ok":inn?"miss":on?"bad":"")});
   if(miss.length)out+='<div><b style="color:var(--miss)">'+c+' – missed:</b> '+miss.join(", ")+'</div>';
   if(bad.length)out+='<div><b style="color:var(--bad)">'+c+' – not on it:</b> '+bad.join(", ")+'</div>';
  });
  if(ok)out='<b style="color:var(--ok)">Perfect! 🎉</b>';
  if(m.note)out+='<div>📝 '+m.note+'</div>';
  $("rs").innerHTML='<div class="res">'+out+'<div class="legend">Green = correct · Dashed amber = missed · Red = not on it</div></div>';
  st.t++;if(ok){st.p++;st.s++}else st.s=0;save();
  const g=$("go");g.textContent="Next salad";g.onclick=next;g.scrollIntoView({block:"nearest",behavior:"smooth"});
 };
}
$("rst").onclick=()=>{st={p:0,t:0,s:0};save()};
save();next();
</script></body></html>
